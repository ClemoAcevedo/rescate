name: CI K006

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

# Un push nuevo a un PR reemplaza su ejecución anterior. Los push a main y development
# no se cancelan: cada SHA de main dispara su propio deploy.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-source:
    name: Main / integration from development
    runs-on: ubuntu-latest
    steps:
      - name: Validate release PR source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$HEAD_BRANCH" = development
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"

  web:
    name: Web / types, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  api:
    name: API / contract, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: OpenAPI structure, references and examples
        run: npm run api:contract:check
      - name: TypeScript
        run: npm run typecheck
      - name: Generated HTTP types
        run: npm run api:types:check
      - name: Tests
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Unit coverage by API layer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api-unit
          path: api/coverage/
          if-no-files-found: error
          retention-days: 14

  sast:
    name: Security / Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - uses: actions/checkout@v4
      - name: Scan application JavaScript and TypeScript
        run: >-
          semgrep scan --config p/javascript --config p/typescript
          --metrics=off --disable-version-check --error
          --json-output=semgrep.json --sarif-output=semgrep.sarif
          api/src web/src
      - name: Publish SAST results, including findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-sast
          path: |
            semgrep.json
            semgrep.sarif
          if-no-files-found: error
          retention-days: 14

  sca:
    name: Security / npm SCA (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install the locked dependency tree
        working-directory: ${{ matrix.package }}
        run: npm ci --no-audit
      - name: Audit production and development dependencies
        working-directory: ${{ matrix.package }}
        run: npm audit --audit-level=high --json > audit.json
      - name: Publish SCA results, including findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-sca-${{ matrix.package }}
          path: ${{ matrix.package }}/audit.json
          if-no-files-found: error
          retention-days: 14

  compose:
    name: Docker Compose / smoke
    needs: [web, api]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build images
        run: docker compose --env-file .env.example build
      - name: Deployment image includes the migration runner and SQL
        run: docker compose --env-file .env.example run --rm --no-deps api node -e "const fs=require('node:fs'); if (!fs.readdirSync('migrations').some(f=>f.endsWith('.sql'))) process.exit(1); require.resolve('node-pg-migrate')"
      - name: Start services
        run: docker compose --env-file .env.example up -d --wait --wait-timeout 120
      - name: API and web
        run: |
          curl --fail --silent --show-error http://localhost:3000/health
          curl --fail --silent --show-error --output /dev/null http://localhost:5173/
          curl --fail --silent --show-error http://localhost:5173/api/health
      - name: PostgreSQL and PostGIS
        run: docker compose exec -T db sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "SELECT current_database(), PostGIS_Version();"'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install migration test dependencies
        run: npm --prefix api ci
      - name: K003 migrations on empty PostgreSQL and rollback
        run: npm --prefix api run db:test:compose
      - name: K010 lots on empty PostgreSQL
        run: npm --prefix api run db:test:lots:compose
      - name: K008 identity infrastructure on empty PostgreSQL
        run: npm --prefix api run db:test:identity:compose
      - name: K014 photo upload, validation, worker restart and cleanup on empty PostgreSQL
        run: npm --prefix api run db:test:photos:compose
      - name: E2 stock adjustments, pause, withdrawal and configurable photos on PostgreSQL
        run: npm --prefix api run db:test:lot-management:compose
      - name: K025 reservation races and pickup deadlines with worker running and stopped
        run: npm --prefix api run db:test:reservations:compose
      - name: K027 waitlist, partial offers and expiry on empty PostgreSQL
        run: npm --prefix api run db:test:waitlist:compose
      - name: K028 lot, reservation and offer expiry with real worker processes, lease recovery and bounded retries
        run: npm --prefix api run db:test:expiries:compose
      - name: K030 notifications outbox, worker batches and dedupe on empty PostgreSQL
        run: npm --prefix api run db:test:notifications:compose
      - name: K031 queue, expiry and notices flow with worker kill -9 and restart
        run: npm --prefix api run db:test:queue-worker:compose
      - name: K034 attempt limits, cross-access isolation and secret-free logs
        run: npm --prefix api run db:test:security:compose
      - name: K035 establishment panel totals reconciled with records across establishments and periods
        run: npm --prefix api run db:test:panel:compose
      - name: K036 request logs, health with PostgreSQL, worker heartbeat and pending tasks
        run: npm --prefix api run db:test:operations:compose
      - name: K037 reservation chat with idempotent retries, closing under the lot lock and daily retention
        run: npm --prefix api run db:test:chat:compose
      - name: Worker
        run: |
          test "$(docker inspect --format '{{.State.Running}}' "$(docker compose ps -q worker)")" = true
          docker compose logs worker | grep -F 'Worker iniciado: vencimientos; validación y limpieza de fotos'
      - name: Service logs
        if: always()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

  # Playwright y Chromium vienen de una imagen fijada a la misma versión que api/package.json.
  # El contenedor comparte la red del runner para que los tests conserven su conexión local a PostgreSQL.
  browser:
    name: Browser / HTTPS flows
    needs: [web, api]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://rescate_dev:rescate_dev_only@127.0.0.1:5432/rescate
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL
        run: docker compose --env-file .env.example up -d --wait --wait-timeout 120 db
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: Install dependencies
        run: |
          npm --prefix api ci
          npm --prefix web ci
      - name: Browser flows in pinned Playwright image
        run: |
          docker run --rm --init --network host --ipc=host \
            --env DATABASE_URL \
            --env WEB_COVERAGE_DIR=/workspace/api/coverage/web/raw \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            bash -lc "node api/scripts/test-web-coverage-collector.mjs && npm --prefix api run db:test:auth:compose && npm --prefix api run test:web:compose && node api/scripts/web-coverage-report.mjs"
      - name: Frontend coverage by module
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: api/coverage/web/
          if-no-files-found: error
          retention-days: 14
      - name: Publish frontend summary
        run: cat api/coverage/web/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Service logs
        if: always()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
