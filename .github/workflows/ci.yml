name: CI K006

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  web:
    name: Web / types, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  api:
    name: API / types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  compose:
    name: Docker Compose / smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build images
        run: docker compose --env-file .env.example build
      - name: Start services
        run: docker compose --env-file .env.example up -d --wait --wait-timeout 120
      - name: API and web
        run: |
          curl --fail --silent --show-error http://localhost:3000/health
          curl --fail --silent --show-error --output /dev/null http://localhost:5173/
          curl --fail --silent --show-error http://localhost:5173/api/health
      - name: PostgreSQL and PostGIS
        run: docker compose exec -T db sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "SELECT current_database(), PostGIS_Version();"'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install migration test dependencies
        run: npm --prefix api ci
      - name: K003 migrations on empty PostgreSQL and rollback
        run: npm --prefix api run db:test:compose
      - name: K010 lots on empty PostgreSQL
        run: npm --prefix api run db:test:lots:compose
      - name: Worker
        run: |
          test "$(docker inspect --format '{{.State.Running}}' "$(docker compose ps -q worker)")" = true
          docker compose logs worker | grep -F 'Worker K006 iniciado'
      - name: Service logs
        if: always()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
