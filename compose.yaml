services:
  db:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rescate}
      POSTGRES_USER: ${POSTGRES_USER:-rescate_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rescate_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build: ./api
    init: true
    environment:
      PORT: "3000"
      # Compose es solo desarrollo: clave pública ficticia para health/smoke.
      RESCATE_ALLOWED_ORIGINS: ${RESCATE_ALLOWED_ORIGINS:-https://localhost:3443}
      CSRF_SIGNING_KEY: ${CSRF_SIGNING_KEY:-cmVzY2F0ZS1kZXYtb25seS1ub3QtYS1yZWFsLXNlY3JldA==}
      # K008/K010: la API necesita el esquema ya migrado. Las migraciones se aplican
      # como etapa aparte (npm run db:migrate), no al arrancar el servicio.
      DATABASE_URL: postgresql://${POSTGRES_USER:-rescate_dev}:${POSTGRES_PASSWORD:-rescate_dev_only}@db:5432/${POSTGRES_DB:-rescate}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(async r => { if (!r.ok || (await r.json()).status !== 'ok') process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  web:
    build: ./web
    init: true
    environment:
      VITE_API_BASE_URL: /api
      API_PROXY_TARGET: http://api:3000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  worker:
    build: ./api
    init: true
    command: ["node", "dist/worker.js"]

volumes:
  postgres_data:
