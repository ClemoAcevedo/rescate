  "/lots/{lotId}/pickup-reviews":
    parameters:
      - $ref: "#/components/parameters/LotId"
    post:
      operationId: "reviewPickupCode"
      summary: "Revisar un código de retiro"
      description: "Operador con membership actual sobre el establecimiento del lote. El código va en el cuerpo, nunca en la ruta. Muestra la reserva del lote con ese código, también si fue cancelada, venció o ya se retiró; no consume el código ni garantiza la entrega. Mayúsculas, espacios y guiones no importan; I/L se leen como 1 y O como 0. Un código inexistente, mal formado o de otro lote responde 404 sin más información y cuenta como fallo del operador. Cinco fallos en 15 minutos, al revisar o al confirmar, suspenden al operador 15 minutos: revisar y confirmar responden 429 con Retry-After, también con el código correcto. Además, como máximo 30 revisiones o confirmaciones por IP cada minuto. Usa POST porque el código no puede ir en la URL; no cambia la reserva."
      tags: ["Reservations"]
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/CsrfCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PickupReviewRequest" }
      responses:
        "200":
          description: "Reserva correspondiente al código y si hoy podría confirmarse."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PickupReview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  "/lots/{lotId}/pickups":
    parameters:
      - $ref: "#/components/parameters/LotId"
    post:
      operationId: "confirmPickup"
      summary: "Confirmar el retiro de una reserva"
      description: "Operador con membership actual. Bajo bloqueo del lote vuelve a comprobar permiso, reserva, código y ventana aunque la revisión previa haya sido válida: se retira desde el inicio de la ventana y antes de su cierre. Registra una única entrega completa, consume el código y mueve los packs de reservados a retirados en la misma transacción. idempotencyKey es un UUID por operador: repetir la misma clave y parámetros reproduce 201 y el cuerpo original; con otros parámetros responde 409. Otro intento sobre una reserva ya retirada responde 409. Los errores no consumen la clave. 409 también si fue cancelada, venció o la ventana aún no comienza; 404 si el código no corresponde a esa reserva del lote, que cuenta como fallo del operador igual que al revisar. Con la revisión suspendida responde 429 con Retry-After, incluso para una clave ya usada."
      tags: ["Reservations"]
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/CsrfCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmPickupRequest" }
      responses:
        "201":
          description: "Entrega registrada o reproducción del resultado original con la misma clave."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PickupResponse" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  "/notifications":
    get:
      operationId: "listNotifications"
      summary: "Listar los avisos propios"
      description: "Avisos del actor de la sesión, más recientes primero, en páginas de 20, con el total sin leer. Persisten aunque la persona estuviera desconectada. Solo muestran datos del propio titular y nunca códigos de retiro; el detalle enlazado (solicitud o reserva) vuelve a comprobar permisos y estado vigente. El worker genera el aviso después de la transición, por lo que puede tardar unos segundos en aparecer."
