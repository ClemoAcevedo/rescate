  "/lots/{lotId}/photos/{photoId}/{variant}":
    parameters:
      - $ref: "#/components/parameters/LotId"
      - $ref: "#/components/parameters/PhotoId"
      - name: variant
        in: path
        required: true
        description: "display: hasta 1600 px y 500 KiB. thumbnail: hasta 400 px y 100 KiB."
        schema: { type: string, enum: [display, thumbnail] }
    get:
      operationId: "getLotPhotoImage"
      summary: "Obtener una imagen lista"
      description: "Lote publicado: pública, sin sesión. Borrador: solo operador del establecimiento; para otros responde 404 sin confirmar existencia. Siempre WebP generado por el worker, sin EXIF. Las rutas aparecen en LotPhoto y PublicLot.photoUrl."
      tags: ["Photos"]
      security: [{}, { SessionCookie: [] }]
      responses:
        "200":
          description: "Imagen WebP. Cache-Control private, max-age=3600 para lotes publicados y no-store para borradores."
          headers:
            Cache-Control:
              schema: { type: string, enum: ["private, max-age=3600", "no-store"] }
          content:
            image/webp:
              schema: { type: string, contentMediaType: image/webp }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    SessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "__Host-rescate_session"
      description: "Credencial de sesión opaca persistida en PostgreSQL. Cookie HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=43200; sin Domain. Vence absolutamente a las 12 horas del login; GET no renueva. No confundir con el token CSRF."
  parameters:
    Origin:
      name: "Origin"
      in: "header"
      required: true
      description: "Origen exacto permitido por configuración (esquema, host y puerto); ausente, null o no permitido produce 403. El navegador lo envía. No se acepta Referer como sustituto. HTTPS, mismo origen web/API mediante proxy; sin CORS abierto con credenciales."
      schema:
        type: "string"
      example: "https://rescate.example.com"
    CsrfHeader:
      name: "X-CSRF-Token"
      in: "header"
      required: true
      description: "Token recibido en GET /auth/session o login, igual a la cookie CSRF, íntegro y vigente, vinculado a la sesión actual si la hay. Ausente o inválido produce 403. Ver mecanismo firmado en README."
      schema:
        $ref: "#/components/schemas/CsrfToken"
    CsrfCookie:
      name: "__Host-rescate_csrf"
      in: "cookie"
      required: true
      description: "Cookie CSRF HttpOnly/Secure/SameSite=Lax del mismo host, enviada por el navegador. No es cookie de autenticación."
      schema:
        $ref: "#/components/schemas/CsrfToken"
    EstablishmentId:
      name: "establishmentId"
      in: "path"
      required: true
      description: "Identificador público del establecimiento sobre el que se comprobarán permisos."
      schema:
        $ref: "#/components/schemas/PublicId"
      example: "est_demo_P8m"
    PhotoId:
      name: "photoId"
      in: "path"
      required: true
      description: "Identificador público aleatorio de la foto; nunca es un nombre aportado por el usuario."
      schema:
        $ref: "#/components/schemas/PublicId"
      example: "photo_demo_T2k"
    LotId:
      name: "lotId"
      in: "path"
      required: true
      description: "Identificador público del lote; resolver establecimiento y comprobar permisos en cada acción."
      schema:
        $ref: "#/components/schemas/PublicId"
      example: "lot_demo_R4q"
    NotificationId:
      name: "notificationId"
      in: "path"
      required: true
      description: "Identificador público del aviso; no concede acceso a avisos de otras personas."
      schema:
        $ref: "#/components/schemas/PublicId"
    EntryId:
      name: "entryId"
      in: "path"
      required: true
      description: "Identificador público de la solicitud de espera; no concede acceso a otras personas."
      schema:
        $ref: "#/components/schemas/PublicId"
      example: "wl_demo_M2x"
    ReservationId:
      name: "reservationId"
      in: "path"
      required: true
      description: "Identificador público de la reserva; no es el código de retiro ni concede acceso."
      schema:
        $ref: "#/components/schemas/PublicId"
      example: "res_demo_K9w"
  headers:
    NoStore:
      description: "Todas las respuestas de estas operaciones llevan Cache-Control: no-store."
      schema:
        type: "string"
        const: "no-store"
    CsrfCookie:
      description: "Emitir cuando falta o se invalida el contexto CSRF: __Host-rescate_csrf=<token-opaco>; Path=/; Max-Age=43200; HttpOnly; Secure; SameSite=Lax. Sin Domain. El mismo token se devuelve en csrfToken. No autentica, no crea cuenta ni sesión autenticada. No reemplazar un token válido en cada GET."
      schema:
        type: "string"
      example: "__Host-rescate_csrf=csrf_ficticio_no_utilizable; Path=/; Max-Age=43200; HttpOnly; Secure; SameSite=Lax"
    LoginCookies:
      description: "Dos líneas Set-Cookie independientes (nunca concatenar con coma): __Host-rescate_session=<credencial-opaca>; Path=/; Max-Age=43200; HttpOnly; Secure; SameSite=Lax y __Host-rescate_csrf=<nuevo-token>; Path=/; Max-Age=43200; HttpOnly; Secure; SameSite=Lax. Sin Domain. Login rota ambos valores; sesión persistida en PostgreSQL, vencimiento absoluto a las 12 horas. OpenAPI representa el nombre de header una vez; el ejemplo muestra solo la cookie de sesión."
      schema:
        type: "string"
      example: "__Host-rescate_session=sesion_ficticia_no_utilizable; Path=/; Max-Age=43200; HttpOnly; Secure; SameSite=Lax"
    LogoutCookies:
      description: "Dos líneas Set-Cookie independientes, una por __Host-rescate_session y __Host-rescate_csrf, valor vacío, Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax; sin Domain. Además se revoca la sesión en servidor."
      schema:
        type: "string"
      example: "__Host-rescate_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax"
    RetryAfter:
      description: "Segundos hasta poder volver a intentar; no HTTP-date en este contrato."
      schema:
        type: "integer"
        minimum: 1
      example: 900
  responses:
    MalformedRequest:
      description: "MALFORMED_REQUEST: Solicitud mal formada: JSON ilegible o framing HTTP inválido."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "MALFORMED_REQUEST"
              message: "No se pudo interpretar la solicitud."
    Unauthenticated:
      description: "UNAUTHENTICATED: Sesión ausente, vencida o inválida; en login, correo o contraseña incorrectos sin distinguir cuál."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "UNAUTHENTICATED"
              message: "No se pudo autenticar la solicitud."
    Forbidden:
      description: "FORBIDDEN: Origen o protección CSRF inválidos, o falta de permiso sobre el establecimiento/lote. No expone datos del objeto."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "FORBIDDEN"
              message: "No se permite esta operación."
    NotFound:
      description: "NOT_FOUND: El establecimiento, lote o reserva solicitado no existe o no es del actor, o el código no corresponde a una reserva del lote."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "NOT_FOUND"
              message: "Recurso inexistente."
    Conflict:
      description: "CONFLICT: Conflicto con el estado actual: correo ya registrado, versión obsoleta, lote que ya no es borrador, clave usada con otros parámetros o reserva cancelada, vencida, ya retirada o fuera de la ventana, según la operación."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "CONFLICT"
              message: "La operación entra en conflicto con el estado actual."
    PayloadTooLarge:
      description: "PAYLOAD_TOO_LARGE: El cuerpo JSON supera 16 KiB (16384 bytes); límite de E1 H p. 20 concretado en bytes para S02."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "PAYLOAD_TOO_LARGE"
              message: "El cuerpo supera el tamaño permitido."
    PhotoTooLarge:
      description: "PAYLOAD_TOO_LARGE: El archivo supera 5 MiB (5242880 bytes); límite de E1 I p. 25 concretado en bytes."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "PAYLOAD_TOO_LARGE"
              message: "La foto supera 5 MiB."
    UnsupportedImageType:
      description: "UNSUPPORTED_MEDIA_TYPE: El cuerpo debe declarar image/jpeg, image/png o image/webp; la firma de los bytes se valida aparte."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "UNSUPPORTED_MEDIA_TYPE"
              message: "Se requiere image/jpeg, image/png o image/webp."
    UnsupportedMediaType:
      description: "UNSUPPORTED_MEDIA_TYPE: El cuerpo debe utilizar application/json."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "UNSUPPORTED_MEDIA_TYPE"
              message: "Se requiere application/json."
    ValidationError:
      description: "VALIDATION_ERROR: JSON legible pero entrada inválida: campos, tipos, propiedades desconocidas o reglas de ventana. details puede localizar los campos."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Revisa los campos indicados."
              details:
                issues:
                  -
                    path: "/quantity"
                    message: "Debe ser un entero positivo."
    TooManyRequests:
      description: "RATE_LIMITED: Límite de solicitudes, de intentos de login o de códigos de retiro alcanzado según E1 H p. 21. Retry-After indica segundos de espera."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "RATE_LIMITED"
              message: "Espera antes de volver a intentar."
    InternalError:
      description: "INTERNAL_ERROR: Fallo inesperado; mensaje público genérico, sin SQL, trazas, credenciales ni detalles internos."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "INTERNAL_ERROR"
              message: "No se pudo completar la solicitud."
    Unavailable:
      description: "SERVICE_UNAVAILABLE: Dependencia temporalmente indisponible; no afirmar que el comando se confirmó. No reintentar automáticamente una creación."
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "SERVICE_UNAVAILABLE"
              message: "El servicio no está disponible temporalmente."
  schemas:
    PublicLot:
      type: object
      additionalProperties: false
      required: [id, description, category, quantity, availableQuantity, conditions, address, latitude, longitude, timeZone, pickupStartsAt, pickupEndsAt, photoUrl, photos, distanceKm]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        description: { $ref: "#/components/schemas/LotDescription" }
        category: { $ref: "#/components/schemas/Category" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        availableQuantity: { type: integer, minimum: 0, description: "Packs libres al instante de la lectura; puede cambiar." }
        conditions: { $ref: "#/components/schemas/Conditions" }
        address: { $ref: "#/components/schemas/Address" }
        latitude: { $ref: "#/components/schemas/Latitude" }
        longitude: { $ref: "#/components/schemas/Longitude" }
        timeZone: { $ref: "#/components/schemas/TimeZone" }
        pickupStartsAt: { $ref: "#/components/schemas/Instant" }
        pickupEndsAt: { $ref: "#/components/schemas/Instant" }
        photoUrl: { type: [string, "null"], pattern: "^/lots/[^/]+/photos/[^/]+/(thumbnail|display)$", description: "Ruta relativa a la base de la API de la primera foto lista: miniatura en la búsqueda e imagen de presentación en el detalle. null muestra reemplazo local." }
        photos: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/PublicLotPhoto" }, description: "Fotos listas en orden de posición; vacío muestra reemplazo local. photoUrl corresponde a la primera." }
        distanceKm: { type: [number, "null"], minimum: 0, description: "Distancia geográfica aproximada al punto enviado." }
    PublicLotPhoto:
      type: object
      additionalProperties: false
      required: [id, width, height, thumbnailUrl, displayUrl]
      description: "Foto lista de un lote publicado. Las imágenes se leen sin sesión."
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        width: { type: integer, minimum: 1, maximum: 1600, description: "Ancho de la imagen de presentación." }
        height: { type: integer, minimum: 1, maximum: 1600 }
        thumbnailUrl: { type: string, pattern: "^/lots/[^/]+/photos/[^/]+/thumbnail$" }
        displayUrl: { type: string, pattern: "^/lots/[^/]+/photos/[^/]+/display$" }
    OperatorLotSummary:
      type: object
      additionalProperties: false
      required: [id, status, version, description, category, quantity, reservedQuantity, pickupStartsAt, pickupEndsAt, timeZone, createdAt, publishedAt, photoUrl]
      description: "Resumen de un lote para el operador de su establecimiento."
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        status: { $ref: "#/components/schemas/LotStatus" }
        version: { $ref: "#/components/schemas/Version" }
        description: { $ref: "#/components/schemas/LotDescription" }
        category: { $ref: "#/components/schemas/Category" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        reservedQuantity: { type: integer, minimum: 0, description: "Packs en reservas confirmadas; 0 en borradores." }
        pickupStartsAt: { $ref: "#/components/schemas/Instant" }
        pickupEndsAt: { $ref: "#/components/schemas/Instant" }
        timeZone: { $ref: "#/components/schemas/TimeZone" }
        createdAt: { $ref: "#/components/schemas/Instant" }
        publishedAt: { type: [string, "null"], format: date-time }
        photoUrl: { type: [string, "null"], pattern: "^/lots/[^/]+/photos/[^/]+/thumbnail$", description: "Miniatura de la primera foto lista." }
    OperatorLotPage:
      type: object
      additionalProperties: false
      required: [items, page, hasNextPage]
      properties:
        items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/OperatorLotSummary" } }
        page: { type: integer, minimum: 1 }
        hasNextPage: { type: boolean }
    PublicLotPage:
      type: object
      additionalProperties: false
      required: [items, page, hasNextPage]
      properties:
        items: { type: array, maxItems: 12, items: { $ref: "#/components/schemas/PublicLot" } }
        page: { type: integer, minimum: 1 }
        hasNextPage: { type: boolean }
    ReserveLotRequest:
      type: object
      additionalProperties: false
      required: [quantity, idempotencyKey]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 2147483647 }
        idempotencyKey: { type: string, format: uuid, description: "UUID generado por el cliente para una intención de reserva." }
    ReservationResponse:
      type: object
      additionalProperties: false
      required: [id, lotId, quantity, status, createdAt]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        lotId: { $ref: "#/components/schemas/PublicId" }
        quantity: { type: integer, minimum: 1, maximum: 2147483647 }
        status: { type: string, const: confirmed, description: "Resultado de la creación. Un reintento con la misma clave lo reproduce aunque la reserva haya terminado; el estado vigente y el código se consultan en GET /reservations/{reservationId}." }
        createdAt: { $ref: "#/components/schemas/Instant" }
    ReservationStatus:
      type: string
      enum: [confirmed, cancelled, expired, delivered]
      description: "Estado vigente al responder. confirmed: vigente; cancelled: cancelada por su titular; expired: el lote cerró sin retiro, aunque el trabajador aún no lo haya registrado; delivered: retiro acreditado. Los tres últimos son terminales."
    ReservationLot:
      type: object
      additionalProperties: false
      required: [id, description, conditions, address, latitude, longitude, timeZone, pickupStartsAt, pickupEndsAt]
      description: "Lote de la reserva para su titular: contenido, lugar y plazo publicados."
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        description: { $ref: "#/components/schemas/LotDescription" }
        conditions: { $ref: "#/components/schemas/Conditions" }
        address: { $ref: "#/components/schemas/Address" }
        latitude: { $ref: "#/components/schemas/Latitude" }
        longitude: { $ref: "#/components/schemas/Longitude" }
        timeZone: { $ref: "#/components/schemas/TimeZone" }
        pickupStartsAt: { $ref: "#/components/schemas/Instant" }
        pickupEndsAt: { $ref: "#/components/schemas/Instant" }
    ReservationSummary:
      type: object
      additionalProperties: false
      required: [id, quantity, status, createdAt, endedAt, lot]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        quantity: { type: integer, minimum: 1, maximum: 2147483647 }
        status: { $ref: "#/components/schemas/ReservationStatus" }
        createdAt: { $ref: "#/components/schemas/Instant" }
        endedAt: { type: [string, "null"], format: date-time, description: "Instante en que terminó; null mientras está confirmada. Una reserva vencida terminó al cierre del lote." }
        lot: { $ref: "#/components/schemas/ReservationLot" }
    ReservationDetail:
      type: object
      additionalProperties: false
      required: [id, quantity, status, createdAt, endedAt, lot, pickupCode]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        quantity: { type: integer, minimum: 1, maximum: 2147483647 }
        status: { $ref: "#/components/schemas/ReservationStatus" }
        createdAt: { $ref: "#/components/schemas/Instant" }
        endedAt: { type: [string, "null"], format: date-time, description: "Instante en que terminó; null mientras está confirmada." }
        lot: { $ref: "#/components/schemas/ReservationLot" }
        pickupCode: { type: [string, "null"], pattern: "^[0-9A-HJKMNP-TV-Z]{8}$", description: "Código de retiro: credencial de ocho caracteres para mostrar al operador. Solo mientras status es confirmed; si no, null. No guardarlo en URL, historial, logs ni almacenamiento persistente del navegador." }
      example:
        id: "res_demo_K9w"
        quantity: 2
        status: "confirmed"
        createdAt: "2030-01-15T12:00:00Z"
        endedAt: null
        lot:
          id: "lot_demo_R4q"
          description: "Pack de cuatro panes surtidos."
          conditions: null
          address: "Dirección ficticia 123"
          latitude: -33.45
          longitude: -70.66
          timeZone: "America/Santiago"
          pickupStartsAt: "2030-01-15T18:00:00Z"
          pickupEndsAt: "2030-01-15T21:00:00Z"
        pickupCode: "7KQ2M9XA"
    ReservationPage:
      type: object
      additionalProperties: false
      required: [items, page, hasNextPage]
      properties:
        items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/ReservationSummary" } }
        page: { type: integer, minimum: 1 }
        hasNextPage: { type: boolean }
    CancelReservationRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: "Objeto vacío: la reserva sale de la ruta y el actor de la sesión."
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [text, idempotencyKey]
      properties:
        text: { type: string, description: "Texto plano de 1 a 1000 caracteres, contados después de recortar los espacios de los bordes." }
        idempotencyKey: { type: string, format: uuid, description: "UUID generado por el cliente para una intención de envío." }
    SentMessage:
      type: object
      additionalProperties: false
      required: [id, sequence, createdAt]
      description: "Resultado del envío. No repite el texto porque el cliente ya lo tiene."
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        sequence: { type: integer, minimum: 1, maximum: 2147483647, description: "Posición del mensaje en la conversación." }
        createdAt: { $ref: "#/components/schemas/Instant" }
    ChatMessage:
      type: object
      additionalProperties: false
      required: [id, sequence, author, mine, text, createdAt]
      description: "Mensaje del chat. Dice si lo escribió el titular o el establecimiento sin revelar qué operador fue."
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        sequence: { type: integer, minimum: 1, maximum: 2147483647 }
        author: { type: string, enum: [holder, operator] }
        mine: { type: boolean, description: "true si lo escribió quien consulta." }
        text: { type: string, minLength: 1, maxLength: 1000 }
        createdAt: { $ref: "#/components/schemas/Instant" }
    ChatMessagePage:
      type: object
      additionalProperties: false
      required: [items, hasMore, open]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/ChatMessage" } }
        hasMore: { type: boolean, description: "true si hay más mensajes después del último de items." }
        open: { type: boolean, description: "true mientras se puede escribir. Cancelar, vencer o retirar la reserva o cerrar el lote lo dejan en false para siempre." }
    JoinWaitlistRequest:
      type: object
      additionalProperties: false
      required: [quantity, idempotencyKey]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 2147483647, description: "Packs que se desean. La oferta puede ser menor (ADR 0002); nunca mayor." }
        idempotencyKey: { type: string, format: uuid, description: "UUID generado por el cliente para una intención de ingreso." }
    WaitlistCommandRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: "Objeto vacío: la solicitud sale de la ruta y el actor de la sesión."
    WaitlistStatus:
      type: string
      enum: [waiting, offered, accepted, declined, expired, left]
      description: "Estado vigente al responder. waiting: en la cola sin packs retenidos; offered: tiene una oferta vigente que retiene packs; accepted, declined, expired y left son terminales. Una oferta no aceptada a tiempo y una espera de un lote cerrado se informan expired aunque el trabajador aún no lo haya registrado."
    WaitlistEntry:
      type: object
      additionalProperties: false
      required: [id, requestedQuantity, status, offeredQuantity, offerExpiresAt, position, reservationId, createdAt, endedAt, lot]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        requestedQuantity: { type: integer, minimum: 1, maximum: 2147483647 }
        status: { $ref: "#/components/schemas/WaitlistStatus" }
        offeredQuantity: { type: [integer, "null"], minimum: 1, maximum: 2147483647, description: "Packs ofrecidos, nunca más que los solicitados; null si nunca recibió una oferta. Se conserva tras rechazar, vencer o aceptar." }
        offerExpiresAt: { type: [string, "null"], format: date-time, description: "Fin de la vigencia de la oferta: diez minutos o el cierre del lote, lo que ocurra primero." }
        position: { type: [integer, "null"], minimum: 1, description: "Lugar en la cola (1 es el primero) mientras status es waiting; si no, null." }
        reservationId: { oneOf: [{ $ref: "#/components/schemas/PublicId" }, { type: "null" }], description: "Reserva creada al aceptar, por la cantidad ofrecida; null en cualquier otro estado." }
        createdAt: { $ref: "#/components/schemas/Instant" }
        endedAt: { type: [string, "null"], format: date-time, description: "Instante en que terminó; null mientras espera o tiene una oferta vigente. Una oferta vencida terminó al llegar su hora y una espera al cierre del lote." }
        lot: { $ref: "#/components/schemas/ReservationLot" }
    WaitlistPage:
      type: object
      additionalProperties: false
      required: [items, page, hasNextPage]
      properties:
        items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/WaitlistEntry" } }
        page: { type: integer, minimum: 1 }
        hasNextPage: { type: boolean }
    PickupCode:
      type: string
      minLength: 1
      maxLength: 32
      description: "Código tal como lo dicta la persona; el servidor ignora espacios, guiones y mayúsculas. Nunca en URL ni logs."
    PickupReviewRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/PickupCode" }
    ReviewedReservation:
      type: object
      additionalProperties: false
      required: [id, quantity, status, createdAt, endedAt]
      description: "Reserva vista por el operador: sin datos del titular ni el código."
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        quantity: { type: integer, minimum: 1, maximum: 2147483647 }
        status: { $ref: "#/components/schemas/ReservationStatus" }
        createdAt: { $ref: "#/components/schemas/Instant" }
        endedAt: { type: [string, "null"], format: date-time }
    PickupReview:
      type: object
      additionalProperties: false
      required: [reservation, canConfirm]
      properties:
        reservation: { $ref: "#/components/schemas/ReviewedReservation" }
        canConfirm: { type: boolean, description: "true si la reserva está confirmada y la ventana ya comenzó. Es orientativo: confirmar vuelve a validar todo bajo bloqueo. false con status confirmed significa que la ventana aún no comienza." }
    ConfirmPickupRequest:
      type: object
      additionalProperties: false
      required: [reservationId, code, idempotencyKey]
      properties:
        reservationId: { type: string, format: uuid, description: "Reserva mostrada por la revisión." }
        code: { $ref: "#/components/schemas/PickupCode" }
        idempotencyKey: { type: string, format: uuid, description: "UUID generado por el cliente para esta confirmación; único por operador." }
    PickupResponse:
      type: object
      additionalProperties: false
      required: [reservationId, quantity, deliveredAt]
      properties:
        reservationId: { $ref: "#/components/schemas/PublicId" }
        quantity: { type: integer, minimum: 1, maximum: 2147483647, description: "Packs entregados: la reserva completa." }
        deliveredAt: { $ref: "#/components/schemas/Instant" }
    NotificationKind:
      type: string
      enum: [offer_issued, offer_expired, reservation_confirmed, reservation_cancelled]
      description: "offer_issued: oferta por aceptar; offer_expired: la oferta venció sin aceptarse; reservation_confirmed: la oferta aceptada creó la reserva; reservation_cancelled: el titular canceló su reserva."
    Notification:
      type: object
      additionalProperties: false
      required: [id, kind, createdAt, readAt, lot, quantity, waitlistEntryId, reservationId, offerExpiresAt]
      description: "Aviso del titular con los datos de la transición. Sin código de retiro ni datos de otras personas."
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        kind: { $ref: "#/components/schemas/NotificationKind" }
        createdAt: { $ref: "#/components/schemas/Instant" }
        readAt: { type: [string, "null"], format: date-time, description: "null hasta su primera lectura." }
        lot:
          type: object
          additionalProperties: false
          required: [id, description]
          properties:
            id: { $ref: "#/components/schemas/PublicId" }
            description: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 2147483647, description: "Packs ofrecidos, confirmados o cancelados según el tipo." }
        waitlistEntryId: { type: [string, "null"], description: "Solicitud de espera relacionada; null en una cancelación." }
        reservationId: { type: [string, "null"], description: "Reserva relacionada; null en avisos de oferta." }
        offerExpiresAt: { type: [string, "null"], format: date-time, description: "Plazo informado al emitir la oferta; solo en offer_issued. Aceptar vuelve a comprobarlo." }
    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, page, hasNextPage, unreadCount]
      properties:
        items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/Notification" } }
        page: { type: integer, minimum: 1 }
        hasNextPage: { type: boolean }
        unreadCount: { type: integer, minimum: 0, description: "Avisos propios sin leer, en todas las páginas." }
    MarkNotificationReadRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: "Objeto vacío: el aviso sale de la ruta y el actor de la sesión."
    LocalDate:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      format: date
      description: "Fecha calendario en la zona del establecimiento, sin hora."
    PanelLotRef:
      type: object
      additionalProperties: false
      required: [id, description]
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        description: { $ref: "#/components/schemas/LotDescription" }
    PanelInventory:
      type: object
      additionalProperties: false
      required: [free, offered, reserved, delivered, unassignable]
      description: "Packs por estado (anexos B p. 4): Q = F + O + R + E + X. Una oferta vencida sin registrar ya cuenta como libre."
      properties:
        free: { type: integer, minimum: 0 }
        offered: { type: integer, minimum: 0 }
        reserved: { type: integer, minimum: 0 }
        delivered: { type: integer, minimum: 0, description: "Retiros acreditados por el operador." }
        unassignable: { type: integer, minimum: 0, description: "Liberados con el lote ya cerrado; no vuelven a asignarse." }
    PanelOpenLot:
      type: object
      additionalProperties: false
      required: [id, description, quantity, pickupStartsAt, pickupEndsAt, inventory, confirmedReservations, activeOffers, waitingRequests]
      description: "Lote publicado con la ventana de retiro abierta."
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        description: { $ref: "#/components/schemas/LotDescription" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        pickupStartsAt: { $ref: "#/components/schemas/Instant" }
        pickupEndsAt: { $ref: "#/components/schemas/Instant" }
        inventory: { $ref: "#/components/schemas/PanelInventory" }
        confirmedReservations: { type: integer, minimum: 0, description: "Reservas vigentes por retirar." }
        activeOffers: { type: integer, minimum: 0, description: "Ofertas vigentes por aceptar." }
        waitingRequests: { type: integer, minimum: 0, description: "Personas en la cola sin oferta; no poseen packs." }
    PanelRate:
      type: object
      additionalProperties: false
      required: [numerator, denominator, value]
      properties:
        numerator: { type: integer, minimum: 0 }
        denominator: { type: integer, minimum: 0 }
        value: { type: [number, "null"], minimum: 0, maximum: 1, description: "numerator / denominator; null sin denominador." }
    EstablishmentPanel:
      type: object
      additionalProperties: false
      required: [establishment, asOf, current, period]
      properties:
        establishment:
          type: object
          additionalProperties: false
          required: [id, name, timeZone]
          properties:
            id: { $ref: "#/components/schemas/PublicId" }
            name: { type: string }
            timeZone: { $ref: "#/components/schemas/TimeZone" }
        asOf: { $ref: "#/components/schemas/Instant" }
        current:
          type: object
          additionalProperties: false
          required: [lots, inventory, confirmedReservations, activeOffers, waitingRequests]
          description: "Estado vigente al consultar. Cada total es la suma de lots."
          properties:
            lots: { type: array, items: { $ref: "#/components/schemas/PanelOpenLot" }, description: "Todos los lotes abiertos, por cierre más próximo." }
            inventory: { $ref: "#/components/schemas/PanelInventory" }
            confirmedReservations: { type: integer, minimum: 0 }
            activeOffers: { type: integer, minimum: 0 }
            waitingRequests: { type: integer, minimum: 0 }
        period:
          type: object
          additionalProperties: false
          required: [from, to, closedLots, packs, reservations, deliveryRate, reservationExpiryRate, excluded]
          description: "RF12: lotes cerrados dentro del período. Retirado es entrega acreditada, no consumo; no se convierte en kilos ni ahorro."
          properties:
            from: { $ref: "#/components/schemas/LocalDate" }
            to: { $ref: "#/components/schemas/LocalDate" }
            closedLots: { type: integer, minimum: 0 }
            packs:
              type: object
              additionalProperties: false
              required: [published, delivered, unassignable]
              description: "En un lote cerrado published = delivered + unassignable."
              properties:
                published: { type: integer, minimum: 0 }
                delivered: { type: integer, minimum: 0 }
                unassignable: { type: integer, minimum: 0 }
            reservations:
              type: object
              additionalProperties: false
              required: [confirmed, cancelled, expired, delivered]
              description: "confirmed cuenta todas las reservas que llegaron a confirmarse; las otras tres son su término y suman confirmed. Ofertas no aceptadas y la espera no son reservas."
              properties:
                confirmed: { type: integer, minimum: 0 }
                cancelled: { type: integer, minimum: 0 }
                expired: { type: integer, minimum: 0 }
                delivered: { type: integer, minimum: 0 }
            deliveryRate:
              allOf: [{ $ref: "#/components/schemas/PanelRate" }]
              description: "Packs retirados sobre packs publicados."
            reservationExpiryRate:
              allOf: [{ $ref: "#/components/schemas/PanelRate" }]
              description: "Reservas vencidas sobre reservas que llegaron a confirmarse."
            excluded:
              type: object
              additionalProperties: false
              required: [openLots, draftLots]
              description: "Lotes del establecimiento que no entran en los indicadores: publicados aún abiertos y borradores."
              properties:
                openLots: { type: integer, minimum: 0 }
                draftLots: { type: integer, minimum: 0 }
    CommitmentStatus:
      type: string
      enum: [confirmed, cancelled, expired, delivered, waiting, offered, accepted, declined, left]
      description: "Reserva: ReservationStatus. Solicitud de espera: WaitlistStatus. Vigente al responder."
    OperatorCommitment:
      type: object
      additionalProperties: false
      required: [id, kind, status, lot, quantity, offeredQuantity, offerExpiresAt, createdAt, endedAt]
      description: "Reserva o solicitud de espera vista por el operador: sin titular ni código."
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        kind: { type: string, enum: [reservation, waitlist] }
        status: { $ref: "#/components/schemas/CommitmentStatus" }
        lot: { $ref: "#/components/schemas/PanelLotRef" }
        quantity: { type: integer, minimum: 1, maximum: 2147483647, description: "Packs reservados o, en la espera, solicitados." }
        offeredQuantity: { type: [integer, "null"], minimum: 1, description: "Packs ofrecidos a la solicitud; null en reservas y sin oferta." }
        offerExpiresAt: { type: [string, "null"], format: date-time }
        createdAt: { $ref: "#/components/schemas/Instant" }
        endedAt: { type: [string, "null"], format: date-time }
    OperatorCommitmentPage:
      type: object
      additionalProperties: false
      required: [items, page, hasNextPage]
      properties:
        items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/OperatorCommitment" } }
        page: { type: integer, minimum: 1 }
        hasNextPage: { type: boolean }
    ActivityKind:
      type: string
      enum: [lot_published, lot_expired, lot_withdrawn, reservation_confirmed, reservation_cancelled, reservation_expired, pickup_confirmed, waitlist_joined, offer_issued, offer_accepted, offer_declined, offer_expired, waitlist_left, waitlist_expired]
      description: "reservation_confirmed: reserva directa; offer_accepted: la oferta aceptada creó la reserva; pickup_confirmed: retiro acreditado; waitlist_expired: la espera terminó con el cierre del lote."
    ActivityEvent:
      type: object
      additionalProperties: false
      required: [id, kind, at, lot, quantity]
      properties:
        id: { type: string, description: "Identificador opaco del hecho, estable entre consultas." }
        kind: { $ref: "#/components/schemas/ActivityKind" }
        at: { $ref: "#/components/schemas/Instant" }
        lot: { $ref: "#/components/schemas/PanelLotRef" }
        quantity: { type: [integer, "null"], minimum: 1, description: "Packs del hecho; null en el cierre del lote." }
    ActivityPage:
      type: object
      additionalProperties: false
      required: [items, page, hasNextPage]
      properties:
        items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/ActivityEvent" } }
        page: { type: integer, minimum: 1 }
        hasNextPage: { type: boolean }
    PublicId:
      type: "string"
    LotPhoto:
      type: object
      additionalProperties: false
      required: [id, position, status, createdAt, width, height, rejectionReason, thumbnailUrl, displayUrl]
      description: "Foto de un lote para su operador. Sin claves de objeto, tamaño original ni autor interno."
      properties:
        id: { $ref: "#/components/schemas/PublicId" }
        position: { type: integer, minimum: 1, maximum: 3 }
        status:
          type: string
          enum: [uploading, pending, ready, rejected]
          description: "uploading: carga en curso; pending: en validación; ready: visible; rejected: debe quitarse antes de publicar."
        createdAt: { $ref: "#/components/schemas/Instant" }
        width: { type: [integer, "null"], minimum: 1, maximum: 1600, description: "Ancho de la imagen de presentación; solo en ready." }
        height: { type: [integer, "null"], minimum: 1, maximum: 1600 }
        rejectionReason:
          type: [string, "null"]
          enum: [unsupported_format, animated, too_many_pixels, undecodable, output_too_large, processing_failed, null]
          description: "Solo en rejected."
        thumbnailUrl: { type: [string, "null"], pattern: "^/lots/[^/]+/photos/[^/]+/thumbnail$", description: "Ruta relativa a la base de la API; solo en ready." }
        displayUrl: { type: [string, "null"], pattern: "^/lots/[^/]+/photos/[^/]+/display$" }
    LotPhotoList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/LotPhoto" } }
      description: "Identificador público opaco. No es la PK bigint ni su conversión a string; no se presupone UUID, prefijo ni formato concreto. Los ejemplos no fijan representación. No sustituye autorización."
      minLength: 1
    EmailInput:
      type: "string"
      description: "Correo identificador, sin afirmar verificación. Registro y login recortan espacios exteriores y comparan sin distinguir mayúsculas/minúsculas; se conservan puntos y sufijos +. La respuesta devuelve el correo normalizado en minúsculas. En entrada el formato se comprueba DESPUÉS de normalizar."
      minLength: 1
    Email:
      type: "string"
      description: "Correo normalizado en minúsculas, sin espacios exteriores; no afirma verificación ni elimina puntos o sufijos +."
      format: "email"
    Password:
      type: "string"
      description: "Contraseña de entrada; mínimo de 12 caracteres. Nunca se devuelve ni se registra en logs."
      minLength: 12
      writeOnly: true
    RegisterRequest:
      type: "object"
      additionalProperties: false
      required:
        - "email"
        - "password"
        - "privacyConsent"
      properties:
        email:
          $ref: "#/components/schemas/EmailInput"
        password:
          $ref: "#/components/schemas/Password"
        privacyConsent:
          type: "boolean"
          description: "Consentimiento para tratar el correo de la cuenta. false responde 422 y no crea la cuenta; true queda registrado con la versión vigente del texto."
      description: "Crea solo la cuenta; no acepta establishmentId, membresías, roles ni displayName."
    LoginRequest:
      type: "object"
      additionalProperties: false
      required:
        - "email"
        - "password"
      properties:
        email:
          $ref: "#/components/schemas/EmailInput"
        password:
          $ref: "#/components/schemas/Password"
    User:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "email"
      properties:
        id:
          $ref: "#/components/schemas/PublicId"
        email:
          $ref: "#/components/schemas/Email"
      description: "Representación pública mínima; sin credenciales, estado de verificación ni datos persistidos de autenticación."
    RegisterResponse:
      type: "object"
      additionalProperties: false
      required:
        - "user"
      properties:
        user:
          $ref: "#/components/schemas/User"
      description: "Cuenta creada sin sesión ni membresías operables automáticas."
    OperableEstablishment:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "name"
      properties:
        id:
          $ref: "#/components/schemas/PublicId"
        name:
          type: "string"
          minLength: 1
      description: "Establecimiento que esta persona puede operar actualmente. Derivado de habilitación y pertenencia reales; no incluye el ID interno de membership ni un catálogo anticipado de roles."
    Session:
      type: "object"
      additionalProperties: false
      required:
        - "user"
        - "operableEstablishments"
        - "expiresAt"
      properties:
        user:
          $ref: "#/components/schemas/User"
        operableEstablishments:
          type: "array"
          items:
            $ref: "#/components/schemas/OperableEstablishment"
          description: "Lista sin establecimientos duplicados; puede estar vacía. Una persona puede operar varios. Es información para la UI, no autorización reutilizable."
        expiresAt:
          type: "string"
          description: "Vencimiento absoluto de la sesión: 12 horas desde login; consultar sesión no lo renueva."
          format: "date-time"
      description: "Representación pública de sesión. Su credencial opaca viaja exclusivamente en cookie HttpOnly; no hay JWT ni refresh token."
    CsrfToken:
      type: "string"
      description: "Token opaco de protección CSRF, no credencial de autenticación. Copiar al header X-CSRF-Token; no URL, logs ni almacenamiento persistente del frontend."
      minLength: 1
    SessionResponse:
      type: "object"
      additionalProperties: false
      required:
        - "session"
        - "csrfToken"
      properties:
        session:
          oneOf:
            -
              $ref: "#/components/schemas/Session"
            -
              type: "null"
          description: "null para visitante, cookie ausente, sesión inválida o vencida. No crea una sesión autenticada."
        csrfToken:
          $ref: "#/components/schemas/CsrfToken"
    LoginResponse:
      type: "object"
      additionalProperties: false
      required:
        - "session"
        - "csrfToken"
      properties:
        session:
          $ref: "#/components/schemas/Session"
        csrfToken:
          $ref: "#/components/schemas/CsrfToken"
    LotDescription:
      type: "string"
      description: "Contenido del pack indivisible; no hay título adicional. No puede ser solo espacios."
      minLength: 1
      maxLength: 2000
      pattern: "\\S"
    Category:
      type: "string"
      description: "Texto no vacío, representación provisional heredada de K003. No hay catálogo acordado: BLOCKING DECISION solo para fijar un enum/catálogo futuro; no inventar categorías obligatorias."
      minLength: 1
      pattern: "\\S"
    Quantity:
      type: "integer"
      minimum: 1
      description: "Cantidad declarada de packs indivisibles, no stock disponible. Sin máximo funcional de 2 ni de 100 packs."
    Conditions:
      type:
        - "string"
        - "null"
      description: "Condiciones particulares para el retiro, por ejemplo traer una bolsa. null significa que no se indican condiciones particulares. Decisión explícita de S02; no sustituye contenido, dirección ni ventana."
    Address:
      type: "string"
      description: "Dirección del retiro, no solo espacios. Instantánea del lote."
      minLength: 1
      pattern: "\\S"
    Latitude:
      type: "number"
      minimum: -90
      maximum: 90
      description: "Latitud WGS84 en grados."
    Longitude:
      type: "number"
      minimum: -180
      maximum: 180
      description: "Longitud WGS84 en grados."
    TimeZone:
      type: "string"
      description: "Identificador IANA válido, por ejemplo America/Santiago. Se valida en aplicación; no se sustituye por un offset fijo."
      minLength: 1
    Instant:
      type: "string"
      description: "Instante RFC 3339 con Z u offset explícito; respuestas en UTC (Z). No aceptar hora local sin offset."
      format: "date-time"
    LotStatus:
      type: "string"
      enum:
        - "draft"
        - "published"
        - "expired"
        - "withdrawn"
      description: "expired y withdrawn son cierres lógicos: el lote deja de ofrecerse, pero se conserva con su historial."
    Version:
      type: "integer"
      minimum: 1
      description: "Versión optimista administrada por servidor. Nace en 1 y aumenta en 1 con cada PATCH aceptado y publicación. En comandos significa versión esperada."
    CreateLotDraftRequest:
      type: "object"
      additionalProperties: false
      required:
        - "description"
        - "category"
        - "quantity"
        - "address"
        - "latitude"
        - "longitude"
        - "timeZone"
        - "pickupStartsAt"
        - "pickupEndsAt"
      properties:
        description:
          $ref: "#/components/schemas/LotDescription"
        category:
          $ref: "#/components/schemas/Category"
        quantity:
          $ref: "#/components/schemas/Quantity"
        conditions:
          $ref: "#/components/schemas/Conditions"
        address:
          $ref: "#/components/schemas/Address"
        latitude:
          $ref: "#/components/schemas/Latitude"
        longitude:
          $ref: "#/components/schemas/Longitude"
        timeZone:
          $ref: "#/components/schemas/TimeZone"
        pickupStartsAt:
          $ref: "#/components/schemas/Instant"
        pickupEndsAt:
          $ref: "#/components/schemas/Instant"
      description: "Borrador completo en sus campos mínimos. conditions omitido equivale a null. El servidor asigna establecimiento desde la ruta y comprueba permiso. No admite id, propietario, status, version ni timestamps del servidor. Ventana: fin posterior a inicio. Fotos opcionales fuera de este contrato de escritura."
    UpdateLotDraftRequest:
      type: "object"
      additionalProperties: false
      required:
        - "version"
      properties:
        version:
          $ref: "#/components/schemas/Version"
        description:
          $ref: "#/components/schemas/LotDescription"
        category:
          $ref: "#/components/schemas/Category"
        quantity:
          $ref: "#/components/schemas/Quantity"
        conditions:
          $ref: "#/components/schemas/Conditions"
        address:
          $ref: "#/components/schemas/Address"
        latitude:
          $ref: "#/components/schemas/Latitude"
        longitude:
          $ref: "#/components/schemas/Longitude"
        timeZone:
          $ref: "#/components/schemas/TimeZone"
        pickupStartsAt:
          $ref: "#/components/schemas/Instant"
        pickupEndsAt:
          $ref: "#/components/schemas/Instant"
      minProperties: 2
      description: "PATCH parcial sobre un borrador completo: versión esperada y al menos un campo editable. Omitido conserva el valor; solo conditions admite null para borrar la indicación. Revalidar el conjunto resultante, incluida la ventana. No permite reasignar establecimiento ni modificar un publicado."
    PublishLotDraftRequest:
      type: "object"
      additionalProperties: false
      required:
        - "version"
      properties:
        version:
          $ref: "#/components/schemas/Version"
      description: "Solo versión esperada del borrador que el operador revisó. No admite contenido nuevo, estado ni publishedAt."
    LotResponse:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "establishmentId"
        - "description"
        - "category"
        - "quantity"
        - "conditions"
        - "address"
        - "latitude"
        - "longitude"
        - "timeZone"
        - "pickupStartsAt"
        - "pickupEndsAt"
        - "status"
        - "version"
        - "createdAt"
        - "publishedAt"
      properties:
        id:
          $ref: "#/components/schemas/PublicId"
        establishmentId:
          $ref: "#/components/schemas/PublicId"
        description:
          $ref: "#/components/schemas/LotDescription"
        category:
          $ref: "#/components/schemas/Category"
        quantity:
          $ref: "#/components/schemas/Quantity"
        conditions:
          $ref: "#/components/schemas/Conditions"
        address:
          $ref: "#/components/schemas/Address"
        latitude:
          $ref: "#/components/schemas/Latitude"
        longitude:
          $ref: "#/components/schemas/Longitude"
        timeZone:
          $ref: "#/components/schemas/TimeZone"
        pickupStartsAt:
          $ref: "#/components/schemas/Instant"
        pickupEndsAt:
          $ref: "#/components/schemas/Instant"
        status:
          $ref: "#/components/schemas/LotStatus"
        version:
          $ref: "#/components/schemas/Version"
        createdAt:
          $ref: "#/components/schemas/Instant"
        publishedAt:
          type:
            - "string"
            - "null"
          format: "date-time"
          description: "null en draft; instante asignado por servidor al publicar."
      description: "Representación para operador autorizado en S02. No incluye reservas, contadores futuros, claves de objetos ni columnas internas. Sin updatedAt inventado. Las fotos son opcionales y se consultan en GET /lots/{lotId}/photos."
      allOf:
        -
          if:
            properties:
              status:
                const: "draft"
          then:
            properties:
              publishedAt:
                type: "null"
          else:
            properties:
              publishedAt:
                type: "string"
                format: "date-time"
    ValidationIssue:
      type: "object"
      additionalProperties: false
      required:
        - "path"
        - "message"
      properties:
        path:
          type: "string"
          description: "JSON Pointer al campo de entrada; no contiene su valor."
          examples:
            - "/quantity"
        message:
          type: "string"
          description: "Descripción segura del problema."
          minLength: 1
    ErrorDetails:
      type: "object"
      additionalProperties: false
      required:
        - "issues"
      properties:
        issues:
          type: "array"
          minItems: 1
          items:
            $ref: "#/components/schemas/ValidationIssue"
      description: "Detalle opcional para validación. Nunca incluye entradas sensibles, secretos ni diagnósticos internos."
    HealthStatus:
      type: "object"
      additionalProperties: false
      required: ["status", "database", "worker"]
      properties:
        status: { type: "string", enum: ["ok", "unavailable"] }
        database: { type: "string", enum: ["ok", "unavailable"] }
        worker: { type: "string", enum: ["ok", "stopped", "unknown"] }
    ErrorResponse:
      type: "object"
      additionalProperties: false
      required:
        - "error"
      properties:
        error:
          type: "object"
          additionalProperties: false
          required:
            - "code"
            - "message"
          properties:
            code:
              type: "string"
              enum:
                - "MALFORMED_REQUEST"
                - "UNAUTHENTICATED"
                - "FORBIDDEN"
                - "NOT_FOUND"
                - "CONFLICT"
                - "PAYLOAD_TOO_LARGE"
                - "UNSUPPORTED_MEDIA_TYPE"
                - "VALIDATION_ERROR"
                - "RATE_LIMITED"
                - "INTERNAL_ERROR"
                - "SERVICE_UNAVAILABLE"
              description: "Código estable para frontend, asociado al estado HTTP documentado."
            message:
              type: "string"
              description: "Mensaje humano seguro; no usarlo como identificador de error."
              minLength: 1
            details:
              $ref: "#/components/schemas/ErrorDetails"
