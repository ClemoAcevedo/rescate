# Contrato S02; estado implementado en README.md.
openapi: "3.1.0"
info:
  title: "Rescate — contrato HTTP S02"
  version: "0.1.0"
  description: "Fuente de verdad HTTP S02 para identidad, lotes del operador y sus fotos, búsqueda pública, reserva directa, cancelación y retiro con código, chat de la reserva, panel del establecimiento, además de /health. No define SQL ni arquitectura interna. Rutas relativas a la base API: el proxy web /api elimina ese prefijo al reenviar. Cuerpos JSON de hasta 16 KiB; las fotos usan su propia ruta binaria de hasta 5 MiB. Seguridad y decisiones en docs/api/README.md; sesión opaca, sin JWT/refresh tokens. Todos los comandos exigen origen permitido y CSRF. Categoría como texto provisional; no catálogo inventado."
servers:
  -
    url: "/api"
    description: "Base relativa del proxy web, prevista bajo HTTPS para cookies Secure. En Express las rutas no llevan /api; configurar la base del cliente para otro despliegue. El Compose HTTP actual no demuestra autenticación segura."
tags:
  -
    name: "Identity"
    description: "RF01: cuenta, sesión y establecimientos operables."
  -
    name: "Lots"
    description: "RF02: borrador completo, edición optimista y publicación por operador autorizado."
  -
    name: "Photos"
    description: "RF02: fotos opcionales de un borrador, validadas por el worker antes de ser visibles."
  -
    name: "Discovery"
    description: "RF03/RF04: exploración pública y reserva directa."
  -
    name: "Reservations"
    description: "RF05/RF06/RF08: reservas del titular, cancelación, código de retiro y entrega acreditada por el operador."
  -
    name: "Waitlist"
    description: "RF07: cola FIFO, ofertas parciales y su aceptación o rechazo por el titular."
  -
    name: "Notifications"
    description: "RF09: avisos internos persistentes del titular y su lectura."
  -
    name: "Chat"
    description: "RF13 conversación de texto entre el titular y el establecimiento sobre una reserva vigente."
  -
    name: "Operations"
    description: "RNF04: salud del proceso, de la base y del worker."
  -
    name: "Panel"
    description: "RF10/RF12: panel del establecimiento para su operador, historial y resultados básicos."
paths:
  "/health":
    get:
      operationId: "getHealth"
      summary: "Comprobar el proceso, la base y el worker"
      description: "Consulta PostgreSQL y el último ciclo exitoso del worker. El estado general depende solo del proceso y la base: un worker detenido responde 200. Sin respuesta de la base en 3 s, 503. No pasa por el límite por IP ni se registra."
      tags: ["Operations"]
      security: []
      responses:
        "200":
          description: "Proceso y base disponibles. `worker` es `stopped` sin un ciclo exitoso en 60 s y `unknown` si falta la migración de K036."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: "ok", database: "ok", worker: "ok" }
        "503":
          description: "La base no responde. No incluye host, credenciales ni el error."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: "unavailable", database: "unavailable", worker: "unknown" }
  "/public/lots":
    get:
      operationId: "searchPublicLots"
      summary: "Buscar lotes publicados y vigentes"
      description: "PostGIS calcula distancia geográfica WGS84. Coordenadas opcionales, siempre en par; radiusKm requiere coordenadas. Orden por distancia sin redondear, publicación descendente e ID interno descendente como desempate; sin coordenadas se omite distancia. Páginas de 12 elementos. La disponibilidad puede cambiar entre lecturas. Se rechazan filtros desconocidos o repetidos."
      tags: ["Discovery"]
      security: []
      parameters:
        - name: category
          in: query
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: latitude
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radiusKm
          in: query
          schema: { type: number, exclusiveMinimum: 0, maximum: 100 }
        - name: pickupBefore
          in: query
          description: "Instante RFC 3339; conserva lotes cuya ventana comienza antes o en ese instante."
          schema: { $ref: "#/components/schemas/Instant" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
      responses:
        "200":
          description: "Página de hasta 12 lotes, incluso sin sesión. Distancia aproximada en kilómetros solo si se enviaron coordenadas."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicLotPage" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  "/public/lots/{lotId}":
    parameters:
      - $ref: "#/components/parameters/LotId"
    get:
      operationId: "getPublicLot"
      summary: "Consultar detalle de un lote visible"
      tags: ["Discovery"]
      security: []
      responses:
        "200":
          description: "Detalle público vigente; disponibilidad calculada al leer, sujeta a cambio antes de reservar."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicLot" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  "/public/lots/{lotId}/reservations":
    parameters:
      - $ref: "#/components/parameters/LotId"
    post:
      operationId: "reservePublicLot"
      summary: "Reservar packs disponibles"
      description: "Reserva directa bajo bloqueo del lote. Requiere sesión, Origin y CSRF. idempotencyKey es un UUID del cuerpo, con unicidad por actor durante el piloto. Tras confirmar, la misma clave y parámetros reproducen status 201 y cuerpo, incluso si el lote cerró; otros parámetros producen 409. Los errores no consumen la clave. 409 si cerró la ventana, faltan packs, ya hay reserva activa o el lote está en revisión por contadores distintos de sus reservas; 404 para lote inexistente o borrador. Cantidad entera positiva hasta 2147483647 (límite de almacenamiento), sin tope comercial por persona."
      tags: ["Discovery"]
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/CsrfCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReserveLotRequest" }
      responses:
        "201":
          description: "Reserva confirmada o reproducción del resultado original con la misma clave."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationResponse" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  "/reservations":
    get:
      operationId: "listReservations"
      summary: "Listar las reservas propias"
      description: "Reservas del actor de la sesión, vigentes y terminadas, por creación descendente en páginas de 20. No incluye códigos de retiro. status es el estado vigente al leer: una confirmada cuyo lote cerró se informa expired aunque el trabajador aún no lo haya registrado."
      tags: ["Reservations"]
      security: [{ SessionCookie: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
      responses:
        "200":
          description: "Página de reservas propias."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  "/reservations/{reservationId}":
    parameters:
      - $ref: "#/components/parameters/ReservationId"
    get:
      operationId: "getReservation"
      summary: "Consultar una reserva propia y su código"
      description: "Solo el titular. Una reserva ajena o inexistente responde 404 sin distinguirlas. pickupCode solo aparece mientras la reserva está confirmada y su lote no cerró; cancelada, vencida o retirada devuelve null y el código ya no sirve en el backend. Una reserva confirmada antes de existir códigos recibe el suyo en esta consulta."
      tags: ["Reservations"]
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: "Reserva del titular."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  "/reservations/{reservationId}/cancel":
    parameters:
      - $ref: "#/components/parameters/ReservationId"
    post:
      operationId: "cancelReservation"
      summary: "Cancelar una reserva propia"
      description: "Solo el titular cancela una reserva confirmada antes del cierre del lote. Bajo bloqueo del lote invalida el código y devuelve los packs a libres en la misma transacción. Repetir sobre una cancelada responde 200 con el mismo estado y no libera de nuevo. 409 si ya fue retirada o venció; 404 si es ajena o no existe. Cuerpo: objeto vacío."
      tags: ["Reservations"]
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/CsrfCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelReservationRequest" }
      responses:
        "200":
          description: "Reserva cancelada, sin código."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservationDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  "/reservations/{reservationId}/messages":
    parameters:
      - $ref: "#/components/parameters/ReservationId"
    get:
      operationId: "listReservationMessages"
      summary: "Leer el chat de una reserva"
      description: "Lo leen el titular y los operadores del establecimiento del lote. Para cualquier otra persona responde 404, igual que una reserva inexistente. Devuelve hasta 50 mensajes con secuencia mayor que after, en orden. La consulta periódica manda la última secuencia que ya tiene y así recupera lo que se perdió al desconectarse. El historial se puede leer después del cierre hasta treinta días más tarde, y pasado ese plazo items llega vacío. open dice si todavía se puede escribir. Sin confirmaciones de lectura."
      tags: ["Chat"]
      security: [{ SessionCookie: [] }]
      parameters:
        - name: after
          in: query
          description: "Última secuencia conocida. Con 0 se lee desde el primer mensaje."
          schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }
      responses:
        "200":
          description: "Mensajes posteriores a after."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessagePage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: "sendReservationMessage"
      summary: "Enviar un mensaje en el chat de una reserva"
      description: "Escriben el titular y los operadores del establecimiento mientras la reserva sigue confirmada, su ventana no terminó y el lote no cerró. Se decide bajo el bloqueo del lote, así que un envío que compite con cancelar o retirar se acepta solo si llegó antes. La conversación cerrada responde 409. idempotencyKey es un UUID por autor y repetirlo con el mismo texto devuelve el mensaje original sin duplicarlo, aunque la conversación ya haya cerrado. Otro texto u otra reserva con esa clave responde 409. El texto va sin espacios en los bordes y tiene entre 1 y 1000 caracteres. Máximo 12 envíos por minuto y usuario con ráfaga de 3, y el exceso recibe 429 con Retry-After. El mensaje no cambia la reserva ni acredita el retiro."
      tags: ["Chat"]
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/CsrfCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "201":
          description: "Mensaje guardado, o el original si la clave ya se había usado. No afirma que la otra parte lo leyó."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  "/public/lots/{lotId}/waitlist":
    parameters:
      - $ref: "#/components/parameters/LotId"
    post:
      operationId: "joinWaitlist"
      summary: "Entrar a la cola de espera de un lote"
      description: "Abre una solicitud al final de la cola FIFO cuando la cantidad no se puede reservar directamente: no alcanza o ya hay personas esperando. Con packs libres suficientes y la cola vacía responde 409 y corresponde reservar directamente. Si hay packs libres, la primera solicitud recibe de inmediato una oferta por lo que haya, parcial si no alcanza (ADR 0002); la respuesta ya la refleja. Una solicitud en espera no retiene packs. Requiere sesión, Origin y CSRF. idempotencyKey es un UUID por actor: la misma clave y parámetros devuelven la solicitud existente con su estado vigente; otros parámetros producen 409. 409 también si el lote cerró, ya hay una reserva o solicitud activa de ese lote, o el lote está en revisión por contadores distintos de sus registros; 404 para lote inexistente o borrador."
      tags: ["Waitlist"]
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/CsrfCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinWaitlistRequest" }
      responses:
        "201":
          description: "Solicitud abierta, o la existente para esa clave."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  "/waitlist":
    get:
      operationId: "listWaitlistEntries"
      summary: "Listar las solicitudes de espera propias"
      description: "Solicitudes del actor de la sesión, vigentes y terminadas, por creación descendente en páginas de 20. status es el estado vigente al leer: una oferta cuya hora pasó o una espera de un lote cerrado se informan expired aunque el trabajador aún no lo haya registrado."
      tags: ["Waitlist"]
      security: [{ SessionCookie: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
      responses:
        "200":
          description: "Página de solicitudes."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistPage" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  "/waitlist/{entryId}":
    parameters:
      - $ref: "#/components/parameters/EntryId"
    get:
      operationId: "getWaitlistEntry"
      summary: "Consultar una solicitud de espera propia"
      description: "Estado vigente, posición mientras espera, cantidad ofrecida y su vigencia, y la reserva que nació al aceptar. 404 si es ajena o no existe."
      tags: ["Waitlist"]
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: "Solicitud con su estado vigente."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  "/waitlist/{entryId}/accept":
    parameters:
      - $ref: "#/components/parameters/EntryId"
    post:
      operationId: "acceptWaitlistOffer"
      summary: "Aceptar la oferta vigente"
      description: "Confirma solo la cantidad ofrecida (O → R, sin descontar libres otra vez), cierra la solicitud sin saldo prioritario y crea la reserva con su código de retiro, que se consulta en GET /reservations/{reservationId}. Repetir sobre una aceptada responde 200 con la misma reserva. 409 si no hay oferta, venció (también si el lote cerró), fue rechazada o la solicitud se retiró; 404 si es ajena o no existe. Cuerpo: objeto vacío."
      tags: ["Waitlist"]
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/CsrfCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitlistCommandRequest" }
      responses:
        "200":
          description: "Solicitud aceptada con su reservationId."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  "/waitlist/{entryId}/decline":
    parameters:
      - $ref: "#/components/parameters/EntryId"
    post:
      operationId: "declineWaitlistOffer"
      summary: "Rechazar la oferta vigente"
      description: "Cierra la solicitud, libera solo lo retenido (a libres, o a no asignables si el lote ya cerró) y ofrece a quien sigue en la misma transacción. No conserva prioridad ni reingresa: volver exige una solicitud nueva. Repetir sobre una rechazada responde 200 y no libera de nuevo. 409 si no hay oferta, ya fue aceptada o venció; 404 si es ajena o no existe. Cuerpo: objeto vacío."
      tags: ["Waitlist"]
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/CsrfCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitlistCommandRequest" }
      responses:
        "200":
          description: "Solicitud rechazada."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  "/waitlist/{entryId}/leave":
    parameters:
      - $ref: "#/components/parameters/EntryId"
    post:
      operationId: "leaveWaitlist"
      summary: "Salir de la cola de espera"
      description: "Retira una solicitud que aún espera sin oferta; pierde su posición y volver exige una solicitud nueva. Repetir sobre una retirada responde 200. Con una oferta vigente se rechaza en vez de salir (409). 404 si es ajena o no existe. Cuerpo: objeto vacío."
      tags: ["Waitlist"]
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CsrfHeader"
        - $ref: "#/components/parameters/CsrfCookie"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitlistCommandRequest" }
      responses:
        "200":
          description: "Solicitud retirada."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WaitlistEntry" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
